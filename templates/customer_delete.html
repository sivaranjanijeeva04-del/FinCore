<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Customer | FinCore</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: white;
            width: 450px;
            padding: 40px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #fee2e2;
            color: #dc2626;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
        }

        h2 {
            color: #172554;
            margin-bottom: 12px;
        }

        p {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .customer-name {
            color: #1e3a8a;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            border: none;
            padding: 12px 22px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .cancel {
            background: #e2e8f0;
            color: #334155;
        }

        .delete {
            background: #dc2626;
            color: white;
        }

        .delete:hover {
            background: #b91c1c;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon">
            !
        </div>

        <h2>Delete Customer?</h2>

        <p>
            Are you sure you want to delete this customer?
        </p>

        <div class="customer-name">
            {{ customer.customer_id }} - {{ customer.full_name }}
        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="actions">

                <a href="{% url 'customer_list' %}"
                   class="btn cancel">
                    Cancel
                </a>

                <button type="submit"
                        class="btn delete">
                    Delete Customer
                </button>

            </div>

        </form>

    </div>

</body>
</html>
