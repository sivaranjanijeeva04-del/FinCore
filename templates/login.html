<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FinCore - Login</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            min-height: 100vh;
            background: #f4f6f9;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }


        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.08);
        }


        .logo {
            text-align: center;
            margin-bottom: 10px;

            font-size: 30px;
            font-weight: bold;
            color: #172033;
        }


        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 30px;
        }


        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;
            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }


        .form-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            outline: none;

            font-size: 14px;
        }


        .form-group input:focus {
            border-color: #2563eb;
        }


        .login-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #172033;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }


        .login-btn:hover {
            background: #25334d;
        }


        .message {
            padding: 10px 12px;

            margin-bottom: 18px;

            border-radius: 7px;

            background: #fee2e2;

            color: #991b1b;

            font-size: 13px;
        }


        .signup-link {
            text-align: center;

            margin-top: 22px;

            font-size: 14px;

            color: #6b7280;
        }


        .signup-link a {
            color: #2563eb;

            text-decoration: none;

            font-weight: 600;
        }


        .signup-link a:hover {
            text-decoration: underline;
        }


        .footer-text {
            text-align: center;

            margin-top: 25px;

            font-size: 12px;

            color: #9ca3af;
        }


        @media (max-width: 500px) {

            .login-card {
                padding: 30px 25px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">


        <div class="login-card">


            <div class="logo">
                FinCore
            </div>


            <div class="subtitle">
                Financial Operations Management System
            </div>


            {% if messages %}

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>


            </form>


            <div class="signup-link">

                Don't have an account?

                <a href="/auth/signup/">
                    Create Account
                </a>

            </div>


        </div>


        <div class="footer-text">

            © 2026 FinCore. All rights reserved.

        </div>


    </div>


</body>

</html>
